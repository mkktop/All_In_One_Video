appId: com.aiov.allinonevideo
productName: All In One Video
directories:
  output: dist
# 只保留中英语言包，去掉 Electron 自带的 50+ 语言
electronLanguages:
  - zh-CN
  - en-US
files:
  - out/**
  - package.json
extraResources:
  - from: resources/bin
    to: bin
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: All In One Video
mac:
  # 单个 dmg 同时覆盖 Intel 与 Apple Silicon
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.video
  icon: build/icon.png
  # CI 无签名证书，显式跳过 codesign（产物未签名，安装时右键-打开即可）
  identity: null
