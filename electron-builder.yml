appId: com.aiov.allinonevideo
productName: All In One Video
directories:
  output: dist
# 产物文件名禁用空格：electron-builder 清单里会把空格转连字符，而 GitHub 上传会把空格转点号，
# 三者不一致会让 electron-updater 下载 404。显式命名让 本地文件 = latest.yml url = Release 资产名。
artifactName: All-In-One-Video-${version}-${arch}.${ext}
# 更新源：electron-updater 从 GitHub Releases 读取 latest.yml 并下载差量更新
publish:
  provider: github
  owner: mkktop
  repo: All_In_One_Video
# 只保留中英语言包，去掉 Electron 自带的 50+ 语言
electronLanguages:
  - zh-CN
  - en-US
files:
  - out/**
  - package.json
extraResources:
  - from: resources/bin
    to: bin
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: All In One Video
mac:
  # 单个 dmg 同时覆盖 Intel 与 Apple Silicon
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.video
  icon: build/icon.png
  # CI 无签名证书，显式跳过 codesign（产物未签名，安装时右键-打开即可）
  identity: null
  # ffmpeg/ffprobe 已由下载脚本 lipo 合成双架构，两边字节一致属预期，需白名单放行
  x64ArchFiles: '**/bin/**'
