appId: com.aiov.allinonevideo
productName: All In One Video
directories:
  output: dist
# 直接复用 node_modules 里已解压的 Electron，绕开解压+重命名（本地杀软实时扫描会锁住导致 EPERM）
electronDist: node_modules/electron/dist
# 只保留中英语言包，去掉 Electron 自带的 50+ 语言
electronLanguages:
  - zh-CN
  - en-US
files:
  - out/**
  - package.json
extraResources:
  - from: resources/bin
    to: bin
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: All In One Video
mac:
  target: dmg
  category: public.app-category.video
  icon: build/icon.png
