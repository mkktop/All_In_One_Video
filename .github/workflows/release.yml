name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download ffmpeg/ffprobe
        run: node scripts/download-ffmpeg.mjs --force

      - name: Test
        run: npm test

      - name: Build renderer & main
        run: npx electron-vite build

      - name: Package (${{ matrix.target }})
        run: npx electron-builder ${{ matrix.target }} --config electron-builder.yml --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllInOneVideo-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Release 正文取自仓库根目录的更新说明文件（应用内更新提示也读取它）
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
